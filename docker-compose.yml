services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    ports:
      - "8080:8080"
    environment:
      PORT: "8080"
      CACHE_EXPIRY: "5"
      OPEN_WEATHER_MAP_BASE_URL: "https://api.openweathermap.org/data/2.5"
    env_file:
      - .env

  web:
    build:
      context: ./web
      dockerfile: Dockerfile
    ports:
      - "5173:5173"
    environment:
      BACKEND_URL: "http://api:8080"
    depends_on:
      - api

  # redis:   # uncomment in Step 5
  #   image: redis:7-alpine
